<!-- Công cụ kiểm tra tăng trưởng NutriAZ – dán toàn bộ đoạn này vào phần tử "HTML / Mã nhúng" trên Pancake -->
<iframe id="nutriaz-growth" src="https://nutriazkhoahocxanh-star.github.io/kiem-tra-tang-truong/"
  title="Kiểm tra tăng trưởng của bé theo chuẩn WHO" loading="eager"
  style="display:block;width:100%;height:2800px;border:0;margin:0 auto;"></iframe>
<script>
  // Tự giãn khung theo nội dung bên trong
  window.addEventListener("message", function (e) {
    if (e.origin !== "https://nutriazkhoahocxanh-star.github.io") return;
    if (e.data && e.data.type === "nutriaz-growth-height") {
      document.getElementById("nutriaz-growth").style.height = e.data.height + "px";
    }
  });
</script>
